name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install lint tools
        run: |
          pip install -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: No secret / personal files tracked
        run: python tools/check_tracked_secrets.py
      - name: Dependency lock in sync
        run: python tools/check_lock_sync.py
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: eslint (static/)
        run: npm run lint
      - name: prettier (static/)
        run: npm run format:check

  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {lfs: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.lock
      - name: Install
        run: |
          pip install --require-hashes -r requirements-serve.lock
          pip install pytest==9.1.1
      - name: Unit + API tests
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Eval — model quality + real HTTP serving SLA (gated)
        run: python -B evals/run_evals.py --output-dir reports/evals
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: {name: eval-report, path: reports/evals/, retention-days: 60}
      - name: Validate alert rules
        run: |
          curl -sSLo prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          # SHA-256 from the release's sha256sums.txt: never run an unverified downloaded binary.
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz
          ./prometheus-3.5.0.linux-amd64/promtool check rules monitoring/alerts/telecom-rules.yml

  scaleout:
    runs-on: ubuntu-latest            # 4 vCPU: đo được tăng tuyến tính 1 -> 3 shard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {lfs: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.lock
      - run: |
          pip install --require-hashes -r requirements-serve.lock
          pip install pytest==9.1.1
      - name: Sharded features == single process
        run: python -B -m pytest -q -p no:cacheprovider tests/test_scaleout_features.py
      - name: Detection quality with 2/4/8 shards (replicated side state)
        run: python -B evals/shard_equivalence.py --shards 1 2 4 8 --replicated
      - name: Throughput 1-3 shards + capacity model for 50k TPS
        run: |
          python -B evals/bench_scaleout.py --shards 1 2 3 --batch 64
          python -c "import json;print(json.dumps(json.load(open('reports/evals/scaleout.json'))['capacity'],indent=1,ensure_ascii=False))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: {name: scaleout-report, path: "reports/evals/*.json", retention-days: 60}

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: {lfs: true}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build (amd64, load)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          load: true
          tags: telecom-fraud:ci
          cache-from: type=gha,scope=tfs
          cache-to: type=gha,scope=tfs,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name tfs -p 8080:8080 -e FRAUD_ADMIN_PASSWORD=ci-password-123 -e METRICS_TOKEN=ci telecom-fraud:ci
          for i in $(seq 1 60); do curl -fs localhost:8080/health/ready && break; sleep 3; done
          curl -fsS localhost:8080/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/metrics)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/app/demo-numbers)" = 403
          tok=$(curl -fsS -X POST localhost:8080/api/app/auth/register -H 'content-type: application/json' \
                -d '{"email":"ci@example.com","password":"ci-password-1"}' | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST localhost:8080/api/app/phone/claim-demo -H "Authorization: Bearer $tok"
          curl -fsS localhost:8080/api/app/inbox -H "Authorization: Bearer $tok" >/dev/null
          curl -fsS -X POST localhost:8080/api/login -H 'content-type: application/json' \
               -d '{"username":"viettel_admin","password":"ci-password-123"}' >/dev/null
          curl -fsS -H "Authorization: Bearer ci" localhost:8080/metrics | grep -q tfs_processed_events
          docker logs tfs 2>&1 | tail -20
      - name: Build arm64 (Oracle Ampere)
        if: github.event_name == 'push'
        run: docker buildx build --platform linux/arm64 --cache-from type=gha,scope=tfs-arm --cache-to type=gha,scope=tfs-arm,mode=max .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: {distribution: temurin, java-version: "17"}
      - name: Build debug + release APK (release chỉ HTTPS)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease -PreleaseServer=https://telecom-demo.duckdns.org/app/
