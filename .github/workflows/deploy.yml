name: Deploy

# Khi CI xanh trên main: SSH vào VM, kéo code, build lại container Telecom, smoke test.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY. Repo trên VM: ~/telecom
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: {group: deploy-telecom, cancel-in-progress: false}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$HOST" ]; then echo "::warning::Chưa cấu hình DEPLOY_HOST"; exit 0; fi
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" 'bash -lc "bash ~/telecom/deploy/cloud/deploy.sh"'
          rm -f key
