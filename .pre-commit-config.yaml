# Hook trước commit. Cài một lần:  pip install -r requirements-dev.txt && pre-commit install
# Chạy tay toàn bộ:                pre-commit run --all-files
# Mọi hook là "local/system": dùng đúng ruff đã ghim trong requirements-dev.txt, không tải gì thêm.
# Hook JS cần Node + `npm ci` (package.json); không có Node thì bỏ qua bằng SKIP=eslint,prettier.
repos:
  - repo: local
    hooks:
      - id: forbid-secret-files
        name: forbid secrets/, .env, keys, .docx
        entry: python tools/check_tracked_secrets.py
        language: system
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: eslint
        name: eslint (static/)
        entry: npx --no-install eslint
        language: system
        files: ^static/.*\.js$
      - id: prettier
        name: prettier (static/)
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        files: ^static/.*\.js$
