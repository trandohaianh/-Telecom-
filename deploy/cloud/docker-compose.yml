# Telecom Fraud Shield: MẶC ĐỊNH có HTTPS riêng (Caddy của chính dự án, standalone.Caddyfile), triển khai
# độc lập, không phụ thuộc FieldOps (quyết định 20/11/2026: "mỗi dự án tự có HTTPS").
#   docker compose --env-file .env up -d --build            # Telecom + Caddy riêng (cổng 80/443)
# Tuỳ chọn tiết kiệm: dùng chung VM và Caddy "edge" của FieldOps (Caddy đó đã giữ cổng 80/443):
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.edge.yml up -d --build --no-deps telecom
# setup.sh / deploy.sh chọn theo TELECOM_PROXY_MODE=own|edge (mặc định own).
name: telecom

services:
  telecom:
    build:
      context: ../..
    image: telecom-fraud:local
    restart: unless-stopped
    environment:
      FRAUD_DEMO: ${FRAUD_DEMO:-1}
      FRAUD_PUBLIC: "1"
      FRAUD_ADMIN_USER: ${FRAUD_ADMIN_USER:-viettel_admin}
      FRAUD_ADMIN_PASSWORD: ${FRAUD_ADMIN_PASSWORD:?Thiếu FRAUD_ADMIN_PASSWORD trong .env}
      FRAUD_ADMIN_EMAIL: ${FRAUD_ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?Thiếu METRICS_TOKEN trong .env}
      FRAUD_OTP_PROVIDER: ${FRAUD_OTP_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SMS_COST_USD: ${SMS_COST_USD:-0.08}
      FRAUD_BACKUP_KEEP: ${FRAUD_BACKUP_KEEP:-7}
      FRAUD_PIPELINE_DAILY_AT: ${FRAUD_PIPELINE_DAILY_AT:-02:30}
      # Chỉ tin X-Forwarded-For từ đúng Caddy. Chế độ own: IP TĨNH của Caddy riêng (không đổi khi tạo lại
      # container). Chế độ edge: deploy.sh truyền IP Caddy của FieldOps (proxy_ip.sh). Không bao giờ "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${TELECOM_CADDY_IP:-172.29.10.2}}
      # Chỉ đặt =1 sau khi đã kiểm định trên lưu lượng thật có nhãn (mở chế độ enforce).
      FRAUD_REAL_TRAFFIC_VALIDATED: ${FRAUD_REAL_TRAFFIC_VALIDATED:-0}
      # OTP qua API SMS/brandname của nhà mạng (FRAUD_OTP_PROVIDER=sms-http). Token đặt trong volume:
      #   docker compose cp sms_token telecom:/srv/state/secrets/sms_token
      FRAUD_SMS_HTTP_URL: ${FRAUD_SMS_HTTP_URL:-}
      FRAUD_SMS_HTTP_TOKEN_FILE: ${FRAUD_SMS_HTTP_TOKEN_FILE:-}
      FRAUD_SMS_HTTP_BODY: ${FRAUD_SMS_HTTP_BODY:-}
      FRAUD_SMS_HTTP_OK_FIELD: ${FRAUD_SMS_HTTP_OK_FIELD:-}
      FRAUD_SMS_HTTP_OK_VALUE: ${FRAUD_SMS_HTTP_OK_VALUE:-}
      FRAUD_SMS_BRANDNAME: ${FRAUD_SMS_BRANDNAME:-}
      # Web Push: khoá VAPID tự sinh trong volume (/srv/state/secrets, xem Dockerfile).
      FRAUD_PUSH: ${FRAUD_PUSH:-1}
      FRAUD_VAPID_SUBJECT: ${FRAUD_VAPID_SUBJECT:-}
      FRAUD_SQLITE_SYNCHRONOUS: ${FRAUD_SQLITE_SYNCHRONOUS:-FULL}
      FRAUD_MAX_BODY_BYTES: ${FRAUD_MAX_BODY_BYTES:-1048576}
      # Chế độ demo: xoay vòng file bằng chứng (lưu lượng mô phỏng, ~1,25 GB/ngày nếu không xoay)
      FRAUD_DEMO_EVIDENCE_MAX_MB: ${FRAUD_DEMO_EVIDENCE_MAX_MB:-256}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    volumes:
      - telecom_state:/srv/state
    networks:
      default: {}
      proxy:
        aliases: [telecom]
    deploy:
      resources:
        limits: {memory: 2g}
    logging:   # đĩa Always Free nhỏ: log container không được lớn vô hạn
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      TELECOM_DOMAIN: ${TELECOM_DOMAIN:?Thiếu TELECOM_DOMAIN}
    volumes:
      - ./standalone.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${TELECOM_CADDY_IP:-172.29.10.2}
    depends_on: [telecom]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

volumes:
  telecom_state:
  caddy_data:
  caddy_config:

networks:
  # Mạng riêng giữa Caddy và Telecom, subnet cố định để Caddy có IP tĩnh (FORWARDED_ALLOW_IPS ở trên).
  proxy:
    ipam:
      config:
        - subnet: ${TELECOM_PROXY_SUBNET:-172.29.10.0/24}
