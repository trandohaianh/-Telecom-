# Kafka demo (separate from deploy/cloud): single-node Apache Kafka in KRaft mode + the demo pipeline.
#   docker compose -p telecom-kafka-demo -f deploy/kafka-demo/docker-compose.yml up -d kafka
#   docker compose -p telecom-kafka-demo -f deploy/kafka-demo/docker-compose.yml run --rm demo bench --partitions 2 --rate 4000
#   docker compose -p telecom-kafka-demo -f deploy/kafka-demo/docker-compose.yml down -v
# Broker port is published on loopback only (for local tools); the demo talks to kafka:9092 inside the network.
name: telecom-kafka-demo

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits: {memory: 1200m}

  demo:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: deploy/kafka-demo/Dockerfile
    image: telecom-kafka-demo:local
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      FRAUD_SQLITE_SYNCHRONOUS: FULL
    volumes:
      - demo_state:/srv/state
    deploy:
      resources:
        limits: {memory: 4500m}   # router + up to 4 scoring processes (~650 MB each) + journal

volumes:
  demo_state:
