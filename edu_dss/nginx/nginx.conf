worker_processes auto;
events { worker_connections 2048; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream edu_ui { server streamlit-ui:8501; keepalive 32; }
  upstream edu_api { server fastapi-backend:8000; keepalive 64; }
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    client_max_body_size 512k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://edu_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      # Stream/chunked API responses should reach the client without Nginx buffering.
      proxy_buffering off;
    }
    location /health/ { proxy_pass http://edu_api; access_log off; }
    location / {
      proxy_pass http://edu_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
      proxy_buffering off;
    }
  }
}
