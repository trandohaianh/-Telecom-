# Development services. Provision topics explicitly; use a unique project for tests.
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:29092:29092"   # plaintext, unauthenticated: loopback only
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: telecom-fraud-local-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
  spark:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      IVY_HOME: /home/spark/.ivy2
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ..:/work
      - ivy-cache:/home/spark/.ivy2
    # Repo mount is read-write (checkpoints live under spark/), but local secrets are masked.
    tmpfs:
      - /work/secrets
      - /work/telecom_grpc/secrets
      - /work/telecom_grpc/tls
    working_dir: /work/spark
    command: ["sleep", "infinity"]
    ports:
      - "127.0.0.1:4040:4040"
volumes:
  ivy-cache:
  kafka-data:
